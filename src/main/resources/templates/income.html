<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Add Income - SmartExpense</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
        }

        .navbar {
            background: #667eea;
            color: white;
            padding: 18px 35px;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #20a464;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #667eea;
        }

    </style>

</head>

<body>

<div class="navbar">
    💰 SmartExpense
</div>

<div class="container">
    <div th:if="${message}"
         style="background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;"
         th:text="${message}">
    </div>

    <h1>💰 Add Income</h1>

    <form action="/income" method="post">

        <label>Income Source</label>

        <input
                type="text"
                name="source"
                placeholder="Example: Salary"
                required>


        <label>Amount</label>

        <input
                type="number"
                name="amount"
                placeholder="Enter amount"
                step="0.01"
                required>


        <label>Date</label>

        <input
                type="date"
                name="incomeDate"
                required>

        <label>Description</label>

        <input
                type="text"
                name="description"
                placeholder="Example: Monthly salary">

        <button type="submit">
            Add Income
        </button>

    </form>

    <a href="/dashboard" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>

</html>
