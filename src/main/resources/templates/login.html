<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>SmartExpense - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        .logo {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        .input-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        .input-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5568d9;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        .demo {
            margin-top: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 13px;
            color: #666;
        }

    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">💰</div>

    <h1>SmartExpense</h1>

    <p class="subtitle">
        Smart Expense & Tax Assistant
    </p>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form action="/login" method="post">




            <div class="input-box">
                <label>Username</label>
                <input
                        type="text"
                        name="username"
                        placeholder="Enter your registered username"
                        autocomplete="username"
                        required>
            </div>
        <div class="input-box">

            <label>Password</label>

            <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>

        </div>

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>
    <p>
        Don't have an account?
        <a th:href="@{/register}">Create Account</a>
    </p>


</div>

</body>

</html>
