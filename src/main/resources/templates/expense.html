<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Add Expense - SmartExpense</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
    }

    .navbar {
      background: #667eea;
      color: white;
      padding: 18px 35px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      width: 500px;
      margin: 50px auto;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #c0392b;
    }

    .success {
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      text-decoration: none;
      color: #667eea;
    }

  </style>

</head>

<body>

<div class="navbar">
  💰 SmartExpense
</div>

<div class="container">

  <!-- SUCCESS MESSAGE -->

  <div th:if="${message}"
       class="success"
       th:text="${message}">
  </div>


  <h1>💸 Add Expense</h1>


  <form action="/expense" method="post">

    <label>Expense Category</label>

    <select name="category" required>

      <option value="">Select Category</option>

      <option value="Food">Food</option>

      <option value="Transport">Transport</option>

      <option value="Shopping">Shopping</option>

      <option value="Bills">Bills</option>

      <option value="Entertainment">Entertainment</option>

      <option value="Education">Education</option>

      <option value="Health">Health</option>

      <option value="Other">Other</option>

    </select>


    <label>Amount</label>

    <input
            type="number"
            name="amount"
            placeholder="Enter expense amount"
            step="0.01"
            min="0"
            required>


    <label>Date</label>

    <input
            type="date"
            name="expenseDate"
            required>


    <label>Description</label>

    <input
            type="text"
            name="description"
            placeholder="Example: Lunch">


    <button type="submit">
      Add Expense
    </button>

  </form>


  <a href="/dashboard" class="back">
    ← Back to Dashboard
  </a>

</div>

</body>

</html>
